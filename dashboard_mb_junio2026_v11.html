<style>
:root {
  --bg:         #F0F5FA;
  --panel:      #FFFFFF;
  --panel-alt:  #F5F9FD;
  --acc:        #2577B5;
  --acc-dark:   #0E4B7A;
  --acc-light:  #5BA3D9;
  --acc-pale:   #EBF5FC;
  --acc-mid:    #93C5E8;
  --text:       #0D1B2A;
  --text-mid:   #1E3A5F;
  --text-soft:  #5B7FA6;
  --up:         #2E6B48;
  --up-bg:      #E8F3EE;
  --down:       #A83030;
  --down-bg:    #FAECEC;
  --neutral:    #607080;
  --neutral-bg: #EDF1F5;
  --border:     #B8D4EA;
  --border-s:   #D4E8F5;
  --warn:       #9A6A10;
  --warn-bg:    #FDF4E0;
  --shadow:     0 1px 6px rgba(14,75,122,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:var(--acc-dark);color:#fff;padding:0 24px;display:flex;align-items:center;gap:0;border-bottom:3px solid var(--acc)}
.nav-brand{font-size:15px;font-weight:700;letter-spacing:.3px;padding:14px 0;margin-right:28px;white-space:nowrap;color:#fff}
.nav-brand span{opacity:.65;font-weight:400;font-size:12px;margin-left:6px}
.nav-markets{display:flex;gap:0}
.nav-markets button{background:none;border:none;color:rgba(255,255,255,.65);font-size:13px;padding:14px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;transition:color .15s,border-color .15s;white-space:nowrap}
.nav-markets button:hover{color:#fff}
.nav-markets button.active{color:#fff;border-bottom-color:var(--acc-mid);font-weight:600}
.nav-sep{width:1px;background:rgba(255,255,255,.15);margin:10px 8px}
.nav-periods{display:flex;gap:0;margin-left:auto}
.nav-periods button{background:none;border:none;color:rgba(255,255,255,.6);font-size:12px;padding:8px 10px;cursor:pointer;border-radius:4px;transition:all .15s;white-space:nowrap}
.nav-periods button:hover{color:#fff;background:rgba(255,255,255,.1)}
.nav-periods button.active{color:var(--acc-dark);background:#fff;font-weight:600}

/* LAYOUT */
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px}

/* PERIOD BANNER */
.period-banner{background:var(--acc-dark);color:#fff;border-radius:10px;padding:14px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.period-banner .pb-icon{font-size:20px;opacity:.8}
.period-banner .pb-title{font-size:15px;font-weight:700}
.period-banner .pb-sub{font-size:12px;opacity:.7;margin-top:1px}

/* MARKET CARDS */
.market-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.mc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s;border-top:3px solid var(--border)}
.mc:hover{box-shadow:var(--shadow);border-color:var(--acc-mid)}
.mc.active{border-top-color:var(--acc);background:var(--acc-pale)}
.mc-flag{font-size:18px;margin-bottom:6px}
.mc-label{font-size:11px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.mc-gmv{font-size:17px;font-weight:700;color:var(--text);margin:2px 0}
.mc-ads{font-size:12px;color:var(--text-mid)}
.mc-delta{font-size:11px;font-weight:600;margin-top:4px}
.mc-delta.up{color:var(--up)}
.mc-delta.down{color:var(--down)}
.mc-delta.neu{color:var(--neutral)}

/* SECTION */
.section{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
.sec-head{padding:14px 20px 10px;border-bottom:1px solid var(--border-s);display:flex;align-items:center;gap:10px}
.sec-head h2{font-size:14px;font-weight:700;color:var(--acc-dark);text-transform:uppercase;letter-spacing:.6px}
.sec-head .sec-badge{background:var(--acc-pale);color:var(--acc);font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.3px}
.sec-body{padding:16px 20px}
.sec-foot{padding:8px 20px 10px;border-top:1px solid var(--border-s);display:flex;align-items:center;gap:8px}
.sec-source{font-size:11px;color:var(--text-soft);display:flex;align-items:center;gap:5px}
.sec-source .src-badge{background:var(--neutral-bg);color:var(--neutral);font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.2px}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel-alt);border:1px solid var(--border-s);border-radius:8px;padding:12px 14px;position:relative}
.kpi-label{font-size:11px;color:var(--text-soft);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.kpi-val{font-size:20px;font-weight:700;color:var(--text);line-height:1}
.kpi-val.sm{font-size:17px}
.kpi-val.xs{font-size:14px}
.kpi-sub{font-size:11px;color:var(--text-soft);margin-top:3px}
.kpi-delta{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px}
.kpi-delta.up{background:var(--up-bg);color:var(--up)}
.kpi-delta.down{background:var(--down-bg);color:var(--down)}
.kpi-delta.neu{background:var(--neutral-bg);color:var(--neutral)}
.kpi-divider{grid-column:1/-1;border:none;border-top:1px dashed var(--border);margin:4px 0}
.kpi-comps{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;align-items:center;row-gap:3px}
.kpi-comp-label{font-size:9px;color:var(--text-soft);font-weight:700;letter-spacing:.4px;text-transform:uppercase;min-width:24px}

/* CHART */
.chart-wrap{margin-top:16px;background:var(--panel-alt);border:1px solid var(--border-s);border-radius:8px;padding:14px 16px}
.chart-title{font-size:12px;font-weight:700;color:var(--text-mid);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.chart-canvas{position:relative;height:200px}

/* PRIME DAY */
.pd-hero{background:linear-gradient(135deg,var(--acc-dark),var(--acc));border-radius:10px;color:#fff;padding:16px 20px;margin-bottom:12px}
.pd-hero h3{font-size:14px;font-weight:700;letter-spacing:.3px;margin-bottom:2px}
.pd-hero .pd-dates{font-size:11px;opacity:.7}
.pd-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px}
.pd-kpi{background:rgba(255,255,255,.12);border-radius:7px;padding:10px 12px}
.pd-kpi-label{font-size:10px;opacity:.75;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.pd-kpi-val{font-size:16px;font-weight:700;margin-top:2px}
.pd-kpi-sub{font-size:10px;opacity:.65;margin-top:1px}
.pd-countries{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pd-country{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.pd-country-name{font-size:12px;font-weight:700;color:var(--acc-dark);margin-bottom:8px}
.pd-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border-s)}
.pd-row:last-child{border:none}
.pd-row-label{color:var(--text-soft)}
.pd-row-val{font-weight:600}

/* PORTFOLIO TABLE */
.port-table{width:100%;border-collapse:collapse;font-size:12.5px}
.port-table th{background:var(--acc-dark);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:9px 12px;text-align:right;white-space:nowrap}
.port-table th:first-child{text-align:left;border-radius:6px 0 0 0}
.port-table th:last-child{border-radius:0 6px 0 0}
.port-table td{padding:8px 12px;border-bottom:1px solid var(--border-s);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.port-table td:first-child{text-align:left}
.port-table .tot{background:var(--acc-pale)!important;font-weight:700}
.port-table .tot td{border-top:2px solid var(--border)}
.port-pf-row{cursor:pointer;transition:background .12s}
.port-pf-row:hover td{background:var(--acc-pale)}
.pf-toggle{display:inline-block;width:14px;font-size:10px;color:var(--acc);transition:transform .2s;margin-right:2px}
.pf-detail-row td{background:#F8FBFF!important;padding:12px 14px 14px 32px!important;border-bottom:1px solid var(--border-s)!important}
.pf-detail-row.hidden{display:none}

/* ASIN MINI TABLE */
.asin-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
.asin-table th{background:var(--acc-pale);color:var(--acc-dark);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:5px 8px;text-align:right;border-bottom:1px solid var(--border)}
.asin-table th:first-child,.asin-table th:nth-child(2){text-align:left}
.asin-table td{padding:5px 8px;border-bottom:1px solid var(--border-s);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.asin-table td:first-child{text-align:left;font-family:monospace;font-size:10px;color:var(--text-soft);white-space:nowrap}
.asin-table td:nth-child(2){text-align:left;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asin-table tr:last-child td{border-bottom:none}
.asin-table tr:hover td{background:var(--acc-pale)}

/* TOP TABLE */
.top-table{width:100%;border-collapse:collapse;font-size:12.5px}
.top-table th{background:var(--acc-pale);color:var(--acc-dark);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:8px 12px;text-align:right;border-bottom:2px solid var(--border)}
.top-table th:first-child,.top-table th:nth-child(2){text-align:left}
.top-table td{padding:9px 12px;border-bottom:1px solid var(--border-s);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.top-table td:first-child,.top-table td:nth-child(2){text-align:left}
.top-table tr:last-child td{border-bottom:none}
.top-rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:var(--acc-dark);color:#fff;border-radius:50%;font-size:10px;font-weight:700;margin-right:6px;flex-shrink:0}

/* ACOS */
.acos-good{color:var(--up);font-weight:700}
.acos-warn{color:var(--warn);font-weight:700}
.acos-bad{color:var(--down);font-weight:700}
.port-bar-wrap{display:flex;align-items:center;gap:6px}
.port-bar{height:6px;background:var(--acc);border-radius:3px;min-width:3px}

/* MISC */
.disc-note{background:var(--warn-bg);border:1px solid #e8c860;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--warn)}
.disc-note strong{font-weight:700}
.footer{text-align:center;padding:24px 0 16px;font-size:11px;color:var(--text-soft)}
.footer strong{color:var(--acc)}
.hidden{display:none!important}
.text-up{color:var(--up)}
.text-down{color:var(--down)}
.info-note{font-size:11px;color:var(--text-soft);background:var(--neutral-bg);border-radius:5px;padding:5px 10px;display:inline-block;margin-top:6px}
.dash{color:var(--text-soft)}
.nuevo-badge{background:var(--acc-pale);color:var(--acc);font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px}

@media(max-width:768px){
  .market-cards{grid-template-columns:repeat(2,1fr)}
  .nav-periods{display:none}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}

// ── UTILITIES ─────────────────────────────────────────────────────────────────
function fmt(v, type='eur') {
  if(v===null||v===undefined) return '<span class="dash">—</span>';
  if(type==='eur') return '€'+v.toLocaleString('es-ES',{maximumFractionDigits:0});
  if(type==='pct') return v.toFixed(1)+'%';
  if(type==='num') return v.toLocaleString('es-ES',{maximumFractionDigits:0});
  return v;
}

function fmtDec(v) {
  if(v===null||v===undefined) return '<span class="dash">—</span>';
  return '€'+v.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function delta(cur, prev, invert=false) {
  if(cur===null||cur===undefined||prev===null||prev===undefined||prev===0) return '';
  const d = ((cur-prev)/Math.abs(prev))*100;
  const isUp = invert ? d<0 : d>0;
  const cls = Math.abs(d)<0.5 ? 'neu' : (isUp ? 'up' : 'down');
  const sign = d>0?'+':'';
  return `<span class="kpi-delta ${cls}">${sign}${d.toFixed(1)}%</span>`;
}

function kpiComps(mom, yoy) {
  if(!mom && !yoy) return '';
  let out = '<div class="kpi-comps">';
  if(mom) out += `<span class="kpi-comp-label">MoM</span>${mom}`;
  if(yoy) out += `<span class="kpi-comp-label">YoY</span>${yoy}`;
  return out + '</div>';
}

function acosClass(v) {
  if(v===null||v===undefined||v===0) return '';
  if(v<=15) return 'acos-good';
  if(v<=22) return 'acos-warn';
  return 'acos-bad';
}

function getAds(m, idx) {
  const d = ADS[m];
  if(idx===-1) {
    const spend = d.spend.reduce((a,b)=>a+b,0), sales = d.adSales.reduce((a,b)=>a+b,0);
    const auHasData=d.adUnits&&d.adUnits.some(v=>v!==null);
    const au=auHasData?d.adUnits.reduce((a,b)=>a+(b||0),0):null;
    return { spend, adSales:sales, orders:d.orders.reduce((a,b)=>a+b,0),
             acos:spend/sales*100, roas:sales/spend,
             impressions:d.impressions.reduce((a,b)=>a+b,0), clicks:d.clicks.reduce((a,b)=>a+b,0), adUnits:au };
  }
  return { spend:d.spend[idx], adSales:d.adSales[idx], orders:d.orders[idx],
           acos:d.acos[idx], roas:d.roas[idx], impressions:d.impressions[idx], clicks:d.clicks[idx],
           adUnits:d.adUnits?d.adUnits[idx]:null };
}

function getSales(m, idx) {
  const d=SALES[m], d25=SALES_YOY[m];
  if(idx===-1) {
    const g=d.gmv.reduce((a,b)=>a+(b||0),0), o=d.orders.reduce((a,b)=>a+(b||0),0),
          u=d.units.reduce((a,b)=>a+(b||0),0), p=d.pv.reduce((a,b)=>a+(b||0),0);
    const g25=d25.gmv.reduce((a,b)=>a+(b||0),0), o25=d25.orders.reduce((a,b)=>a+(b||0),0),
          u25=d25.units.reduce((a,b)=>a+(b||0),0), p25=d25.pv.reduce((a,b)=>a+(b||0),0);
    return { gmv:g, orders:o, units:u, pv:p, cvr:p?u/p*100:null, buybox:d.buybox[d.buybox.length-1],
             gmv25:g25, orders25:o25, units25:u25, pv25:p25, cvr25:p25?u25/p25*100:null };
  }
  return { gmv:d.gmv[idx], orders:d.orders[idx], units:d.units[idx], pv:d.pv[idx],
           cvr:d.cvr[idx], buybox:d.buybox[idx], gmv25:d25.gmv[idx], orders25:d25.orders[idx],
           units25:d25.units[idx], pv25:d25.pv[idx], cvr25:d25.cvr[idx] };
}

// ── ASIN HELPERS ──────────────────────────────────────────────────────────────
function getPfKey(pfName) {
  return pfName.replace('ROICOS - ','').trim();
}

function getAsinsByPortfolio(m, pfName) {
  const key = getPfKey(pfName);
  if(m === 'global') {
    const all = ['es','fr','it','de'].flatMap(mk =>
      (ASINS[mk]||[]).map(a => ({...a, _mkt:mk}))
    );
    return all.filter(a => a.portfolio === key).sort((a,b) => b.adSales - a.adSales);
  }
  return (ASINS[m]||[]).filter(a => a.portfolio === key).sort((a,b) => b.adSales - a.adSales);
}

function getTopAsins(m, n) {
  n = n || 5;
  if(m === 'global') {
    const map = {};
    ['es','fr','it','de'].forEach(mk => {
      (ASINS[mk]||[]).forEach(a => {
        if(!map[a.asin]) {
          map[a.asin] = { asin:a.asin, title:a.title, portfolio:a.portfolio,
                          spend:0, adSales:0, units:0, impressions:0, clicks:0, _mkts:[] };
        }
        map[a.asin].spend       += a.spend;
        map[a.asin].adSales     += a.adSales;
        map[a.asin].units       += a.units;
        map[a.asin].impressions += a.impressions;
        map[a.asin].clicks      += a.clicks;
        map[a.asin]._mkts.push(mk);
      });
    });
    return Object.values(map).map(a => ({
      ...a,
      acos: a.adSales > 0 ? (a.spend / a.adSales * 100) : 0
    })).sort((a,b) => b.adSales - a.adSales).slice(0, n);
  }
  return [...(ASINS[m]||[])].sort((a,b) => b.adSales - a.adSales).slice(0, n);
}

function togglePf(pfId, rowEl) {
  const detail = document.getElementById(pfId);
  const toggle = document.getElementById(pfId+'-t');
  if(!detail) return;
  const isHidden = detail.classList.toggle('hidden');
  if(toggle) toggle.style.transform = isHidden ? '' : 'rotate(90deg)';
  if(rowEl) { Array.from(rowEl.cells).forEach(c=>c.style.background=isHidden?'':'var(--acc-pale)'); }
}

function getPortfolioList(m) {
  if(m!=='global') return (PORTFOLIOS[m]||[]).map(p=>({...p}));
  const map={};
  ['es','fr','it','de'].forEach(mk=>{
    (PORTFOLIOS[mk]||[]).forEach(pf=>{
      if(!map[pf.name]) map[pf.name]={name:pf.name,spend:0,sales:0,orders:0,impressions:0,clicks:0};
      map[pf.name].spend+=pf.spend; map[pf.name].sales+=pf.sales;
      map[pf.name].orders+=pf.orders; map[pf.name].impressions+=pf.impressions; map[pf.name].clicks+=pf.clicks;
    });
  });
  return Object.values(map).map(p=>({...p, acos:p.sales?p.spend/p.sales*100:0})).sort((a,b)=>b.sales-a.sales);
}

function getCTData(m, idx) {
  if(m==='global') {
    const types=['SP','SB','SD'];
    const out={};
    types.forEach(t=>{
      out[t]={spend:0,sales:0,impr:0,clicks:0,conv:0};
      ['es','fr','it','de'].forEach(mk=>{
        const d=(CAMPAIGN_TYPE[mk]||[])[idx];
        if(d&&d[t]){out[t].spend+=d[t].spend;out[t].sales+=d[t].sales;out[t].impr+=d[t].impr;out[t].clicks+=d[t].clicks;out[t].conv+=d[t].conv;}
      });
      out[t].acos=out[t].sales>0?out[t].spend/out[t].sales*100:0;
      out[t].roas=out[t].spend>0?out[t].sales/out[t].spend:0;
    });
    return out;
  }
  return (CAMPAIGN_TYPE[m]||[])[idx]||null;
}

    const mkts=m==='global'?['es','fr','it','de']:[m];
    mkts.forEach(mk=>{(CAMPAIGN_TYPE[mk]||[]).forEach(mo=>{types.forEach(t=>{if(mo[t]){totals[t].spend+=mo[t].spend;totals[t].sales+=mo[t].sales;totals[t].impr+=mo[t].impr;totals[t].clicks+=mo[t].clicks;totals[t].conv+=mo[t].conv;}});});});
    types.forEach(t=>{totals[t].acos=totals[t].sales>0?totals[t].spend/totals[t].sales*100:0;totals[t].roas=totals[t].spend>0?totals[t].sales/totals[t].spend:0;});

    const typeLabels={SP:'Sponsored Products',SB:'Sponsored Brands',SD:'Sponsored Display'};
    const typeDesc={SP:'Keywords y Auto — tráfico de alta intención',SB:'Brand Store + Video — visibilidad de marca',SD:'Display — audiencias y remarketing'};
    types.forEach(t=>{
      const d=totals[t]; if(!d.spend) return;
      const acosClass2=d.acos===0?'':d.acos<=15?'acos-good':d.acos<=25?'acos-warn':'acos-bad';
      rows.push(`<tr>
        <td><strong>${typeLabels[t]}</strong><div style="font-size:10.5px;color:var(--text-soft);margin-top:2px">${typeDesc[t]}</div></td>
        <td>${fmt(d.spend)}</td>
        <td>${d.sales>0?fmt(d.sales):'<span class="dash">—</span>'}</td>
        <td class="${acosClass2}">${d.acos>0?d.acos.toFixed(1)+'%':'<span class="dash">—</span>'}</td>
        <td>${d.roas>0?d.roas.toFixed(2)+'x':'<span class="dash">—</span>'}</td>
        <td>${fmt(d.impr,'num')}</td><td>${fmt(d.clicks,'num')}</td><td>${fmt(d.conv,'num')}</td>
      </tr>`);
    });
  } else if(data) {
    const typeLabels={SP:'Sponsored Products',SB:'Sponsored Brands',SD:'Sponsored Display'};
    const typeDesc={SP:'Keywords y Auto — tráfico de alta intención',SB:'Brand Store + Video — visibilidad de marca',SD:'Display — audiencias y remarketing'};
    ['SP','SB','SD'].forEach(t=>{
      const d=data[t]; if(!d||!d.spend) return;
      const p=prevData?prevData[t]:null;
      const acosClass2=d.acos===0?'':d.acos<=15?'acos-good':d.acos<=25?'acos-warn':'acos-bad';
      const mom=p&&p.spend>0?`<div style="font-size:10px;color:var(--text-soft);margin-top:2px">MoM inv: ${((d.spend-p.spend)/p.spend*100).toFixed(1)}%</div>`:'';
      rows.push(`<tr>
        <td><strong>${typeLabels[t]}</strong><div style="font-size:10.5px;color:var(--text-soft);margin-top:2px">${typeDesc[t]}</div></td>
        <td>${fmt(d.spend)}${mom}</td>
        <td>${d.sales>0?fmt(d.sales):'<span style="color:var(--text-soft);font-size:11px">—&nbsp;visibilidad</span>'}</td>
        <td class="${acosClass2}">${d.acos>0?d.acos.toFixed(1)+'%':'<span class="dash">—</span>'}</td>
        <td>${d.roas>0?d.roas.toFixed(2)+'x':'<span class="dash">—</span>'}</td>
        <td>${fmt(d.impr,'num')}</td><td>${fmt(d.clicks,'num')}</td><td>${fmt(d.conv,'num')}</td>
      </tr>`);
    });
  }

  if(!rows.length) return '';
  const periodLabel=idx===-1?'YTD Ene–Ago 2026':MONTHS[idx]+' 2026';
  return `<div class="section">
    <div class="sec-head"><h2>Tipo de Campaña</h2><span class="sec-badge">${mktNames[m]||m} · ${periodLabel}</span></div>
    <div class="sec-body">
      <div style="overflow-x:auto">
        <table class="port-table">
          <thead><tr><th style="text-align:left">Tipo</th><th>Inversión</th><th>Ventas Ads</th><th>ACoS</th><th>ROAS</th><th>Impresiones</th><th>Clics</th><th>Conv.</th></tr></thead>
          <tbody>${rows.join('')}</tbody>
        </table>
      </div>
      <div class="info-note" style="margin-top:10px">ℹ Ventas SB = atribución indirecta (halo). ACoS SB no se calcula sobre ventas directas.</div>
    </div>
    <div class="sec-foot"><div class="sec-source">Fuente: <span class="src-badge">Pacvue</span> <span style="color:var(--text-soft)">Ene–Ago 2026 · SP+SB+SD</span></div></div>
  </div>`;
}

// ── SEARCH TERMS SECTION ──────────────────────────────────────────────────────
function renderSearchTermsSection(m, idx) {
  const mktNames={global:'Global Pan-EU',es:'España',fr:'Francia',it:'Italia',de:'Alemania'};
  const mkts=m==='global'?['es','fr','it','de']:[m];
  let hasData=false;
  let html='';

  mkts.forEach(mk=>{
    const d=(SEARCH_TERMS[mk]||{})[idx];
    if(!d||!d.length) return;
    hasData=true;
    const flag={es:'🇪🇸',fr:'🇫🇷',it:'🇮🇹',de:'🇩🇪'};
    const mktLabel=m==='global'?`<div style="font-size:11px;font-weight:600;color:var(--acc-dark);margin-bottom:6px">${flag[mk]} ${mktNames[mk]}</div>`:'';
    const rows=d.map(r=>{
      const acosClass2=r.acos===0?'':r.acos<=15?'acos-good':r.acos<=25?'acos-warn':'acos-bad';
      const noConv=r.sales===0?'style="opacity:.55"':'';
      return `<tr ${noConv}>
        <td style="font-size:11.5px">${r.q}${r.sales===0?'<span style="font-size:9.5px;color:var(--text-soft);margin-left:4px">sin conv.</span>':''}</td>
        <td>${fmt(r.impr,'num')}</td>
        <td>${r.clicks}</td>
        <td>${fmtDec(r.spend)}</td>
        <td>${r.sales>0?fmtDec(r.sales):'<span class="dash">—</span>'}</td>
        <td class="${acosClass2}">${r.acos>0?r.acos.toFixed(2)+'%':'<span class="dash">—</span>'}</td>
        <td>${r.conv>0?r.conv:'<span class="dash">—</span>'}</td>
      </tr>`;
    }).join('');
    html+=`${mktLabel}<div style="overflow-x:auto;margin-bottom:${m==='global'?'16px':'0'}">
      <table class="asin-table">
        <thead><tr><th>Término de búsqueda</th><th>Impresiones</th><th>Clics</th><th>Inversión</th><th>Ventas Ads</th><th>ACoS</th><th>Conv.</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
  });

  if(!hasData){
    return `<div class="section">
      <div class="sec-head"><h2>Términos de Búsqueda</h2><span class="sec-badge">${mktNames[m]||m} · ${MONTHS[idx]||'YTD'} 2026</span></div>
      <div class="sec-body"><div class="info-note">ℹ Datos de términos de búsqueda disponibles para enero, junio, julio y agosto 2026. Selecciona uno de esos períodos para ver el desglose.</div></div>
    </div>`;
  }

  const dataNote=idx===7?'agosto 2026 (más reciente)':`${(MONTHS[idx]||'').toLowerCase()} 2026`;
  const periodLabel=idx===-1?'YTD':MONTHS[idx]+' 2026';
  return `<div class="section">
    <div class="sec-head"><h2>Términos de Búsqueda</h2><span class="sec-badge">${mktNames[m]||m} · ${periodLabel} · por volumen</span></div>
    <div class="sec-body">
      ${html}
      <div class="info-note" style="margin-top:10px">ℹ Top 8 términos por impresiones · Datos ${dataNote} · Términos sin conversión en gris — candidatos a negativizar o revisar bid.</div>
    </div>
    <div class="sec-foot"><div class="sec-source">Fuente: <span class="src-badge">Pacvue</span> <span style="color:var(--text-soft)">Search Term Report · excluyendo ASINs directos</span></div></div>
  </div>`;
}

// ── ANNOTATIONS SECTION ───────────────────────────────────────────────────────
function renderAnnotationsSection(m, idx) {
  const mktNames={global:'Global Pan-EU',es:'España',fr:'Francia',it:'Italia',de:'Alemania'};
  const mkts=m==='global'?['es','fr','it','de']:[m];
  let html='';

  mkts.forEach(mk=>{
    const ann=(ANNOTATIONS[mk]||[])[idx];
    if(!ann) return;
    const flag={es:'🇪🇸',fr:'🇫🇷',it:'🇮🇹',de:'🇩🇪'};
    const mktLabel=m==='global'?`<div style="font-size:12px;font-weight:700;color:var(--acc-dark);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)">${flag[mk]} ${mktNames[mk]}</div>`:'';

    const insightRows=ann.insights.map(i=>`<div style="display:flex;gap:8px;margin-bottom:6px"><span style="color:var(--acc-dark);flex-shrink:0">◆</span><span>${i}</span></div>`).join('');
    const hypRows=ann.hypotheses.map(h=>`<div style="display:flex;gap:8px;margin-bottom:5px"><span style="color:#8B6914;flex-shrink:0">💡</span><span>${h}</span></div>`).join('');
    const actRows=ann.actions.map(a=>`<div style="display:flex;gap:8px;margin-bottom:5px"><span style="color:#2E6B48;flex-shrink:0">→</span><span>${a}</span></div>`).join('');
    const negRows=ann.negatives.length?ann.negatives.map(n=>`<div style="display:flex;gap:8px;margin-bottom:5px"><span style="color:#A83030;flex-shrink:0">✕</span><span style="font-family:monospace;font-size:11px">${n}</span></div>`).join(''):'';

    html+=`<div style="margin-bottom:${m==='global'?'20px':'0'};padding-bottom:${m==='global'?'20px':'0'};border-bottom:${m==='global'?'1px solid var(--border)':'none'}">
      ${mktLabel}
      ${insightRows?`<div style="font-size:11.5px;margin-bottom:10px">${insightRows}</div>`:''}
      ${hypRows?`<div style="background:rgba(139,105,20,.07);border-left:3px solid #C9A227;border-radius:0 6px 6px 0;padding:10px 12px;margin-bottom:10px;font-size:11.5px">${hypRows}</div>`:''}
      ${actRows?`<div style="background:rgba(46,107,72,.07);border-left:3px solid #2E6B48;border-radius:0 6px 6px 0;padding:10px 12px;margin-bottom:10px;font-size:11.5px">${actRows}</div>`:''}
      ${negRows?`<div style="background:rgba(168,48,48,.07);border-left:3px solid #A83030;border-radius:0 6px 6px 0;padding:10px 12px;font-size:11.5px"><div style="font-size:10.5px;font-weight:600;color:#A83030;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">KW bajo rendimiento</div>${negRows}</div>`:''}
    </div>`;
  });

  if(!html) return '';
  const periodLabel=idx===-1?'YTD Ene–Ago 2026':MONTHS[idx]+' 2026';
  return `<div class="section">
    <div class="sec-head"><h2>Anotaciones del Período</h2><span class="sec-badge">${mktNames[m]||m} · ${periodLabel}</span></div>
    <div class="sec-body">${html}</div>
    <div class="sec-foot"><div class="sec-source">Fuente: <span class="src-badge">Análisis Roicos</span> <span style="color:var(--text-soft)">Basado en datos Pacvue + MerchantSpring</span></div></div>
  </div>`;
}

function render() {
  const {market:m,period:idx}=state;
  renderMarketCards(); renderDiscrepancy(m);
  let html=renderPeriodBanner(m,idx);
  html+=renderSalesSection(m,idx);
  html+=renderAdsSection(m,idx);
  html+=renderCampaignTypeSection(m,idx);
  if(idx===5) html+=renderPrimeDaySection(m,idx);
  html+=renderPortfolioSection(m,idx);
  html+=renderTopSection(m,idx);
  html+=renderTop5CategorySection(m,idx);
  html+=renderSearchTermsSection(m,idx);
  if(m!=='global') html+=renderAnnotationsSection(m,idx);
  if(m==='global') html+=renderGlobalConclusionsSection(idx);
  document.getElementById('content').innerHTML=html;
  setTimeout(()=>{initChartSales(m);initChartAds(m);},50);
  document.querySelectorAll('.nav-markets button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes(`'${m}'`)));
  document.querySelectorAll('.nav-periods button').forEach((b,i)=>b.classList.toggle('active',[0,1,2,3,4,5,6,7,-1][i]===idx));
}

function setMarket(m){state.market=m;render();window.scrollTo({top:0,behavior:'smooth'});}
function setPeriod(idx){state.period=idx;render();}

render();
</script>
